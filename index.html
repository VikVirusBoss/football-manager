<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FC Cyber Manager Pro</title>
    <style>
        :root {
            --bg: #0b0e14;
            --card: #161b22;
            --border: #30363d;
            --accent: #22c55e;
            --text: #ffffff;
            --muted: #8b949e;
            
            /* Цвета редкости */
            --common: #71717a;
            --rare: #3b82f6;
            --epic: #a855f7;
            --legendary: #eab308;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 80px; user-select: none; }

        /* Верхняя панель */
        .top-bar { display: flex; justify-content: space-around; padding: 12px; background: #11141c; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
        .stat-box { text-align: center; }
        .stat-val { font-size: 16px; font-weight: 800; color: var(--accent); }
        .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; }

        .container { padding: 15px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* --- ФУТБОЛЬНОЕ ПОЛЕ (СТАДИОН) --- */
        .pitch {
            width: 100%;
            height: 380px;
            background: linear-gradient(180deg, #14532d 0%, #166534 100%);
            border-radius: 16px;
            border: 3px solid #ffffff;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.5);
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 10px;
        }

        /* Разметка поля */
        .pitch-line-center { position: absolute; top: 50%; left: 0; right: 0; height: 2px; background: rgba(255,255,255,0.4); }
        .pitch-circle-center { position: absolute; top: 50%; left: 50%; width: 90px; height: 90px; border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; transform: translate(-50%, -50%); }
        .pitch-box-top { position: absolute; top: 0; left: 25%; width: 50%; height: 50px; border: 2px solid rgba(255,255,255,0.4); border-top: none; }
        .pitch-box-bottom { position: absolute; bottom: 0; left: 25%; width: 50%; height: 50px; border: 2px solid rgba(255,255,255,0.4); border-bottom: none; }

        /* Игроки на поле (Расстановка) */
        .pitch-row { display: flex; justify-content: center; gap: 20px; z-index: 2; position: relative; }
        .field-player { text-align: center; transition: all 0.3s ease; }
        .field-avatar {
            width: 48px; height: 48px; border-radius: 50%; background: #222733;
            border: 2px solid #fff; display: flex; align-items: center; justify-content: center;
            font-size: 22px; margin: 0 auto 4px; box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        .field-name { font-size: 11px; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .field-role { font-size: 9px; color: #cbd5e1; text-transform: uppercase; }

        /* Подсветка игрока с мячом */
        .field-player.has-ball .field-avatar {
            transform: scale(1.25);
            border-color: #eab308;
            box-shadow: 0 0 15px #eab308;
        }

        /* Мяч */
        .ball {
            position: absolute;
            font-size: 20px;
            z-index: 5;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            opacity: 0;
            pointer-events: none;
        }

        /* Анимация ГОЛ */
        .goal-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7); display: flex; justify-content: center;
            align-items: center; font-size: 36px; font-weight: 900; color: #eab308;
            opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 10;
        }
        .goal-overlay.show { opacity: 1; }

        /* Сетка карточек */
        .player-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        /* Карточка */
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
        .card.rarity-common { border-bottom: 4px solid var(--common); }
        .card.rarity-rare { border-bottom: 4px solid var(--rare); }
        .card.rarity-epic { border-bottom: 4px solid var(--epic); }
        .card.rarity-legendary { border-bottom: 4px solid var(--legendary); box-shadow: 0 0 10px rgba(234, 179, 8, 0.2); }

        .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .avatar-ring { width: 40px; height: 40px; border-radius: 50%; background: #222733; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 2px solid var(--border); }
        .rating-badge { background: #eab308; color: #000; font-weight: 900; font-size: 11px; padding: 2px 6px; border-radius: 6px; }

        .pos-tag { font-size: 10px; font-weight: 700; color: #38bdf8; text-transform: uppercase; }
        .player-name { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .stat-info { font-size: 11px; color: var(--muted); margin-top: 8px; display: flex; justify-content: space-between; }
        .progress-bg { height: 5px; background: #090a0f; border-radius: 3px; margin-top: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); border-radius: 3px; }

        /* Кнопки */
        .btn-main { width: 100%; padding: 15px; background: var(--accent); color: #000; border: none; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .btn-main:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }
        .btn-small { background: #222733; color: #fff; border: 1px solid var(--border); padding: 8px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 8px; }

        .log-box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; font-size: 13px; color: var(--muted); text-align: center; margin-top: 10px; }

        /* Нижнее меню */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: #11141c; border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 10; }
        .nav-item { color: var(--muted); font-size: 11px; text-align: center; cursor: pointer; flex-grow: 1; }
        .nav-item.active { color: var(--accent); font-weight: bold; }
        .nav-icon { font-size: 18px; display: block; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="stat-box"><div id="coins" class="stat-val">1000</div><div class="stat-label">Монеты</div></div>
        <div class="stat-box"><div id="league-pts" class="stat-val">0</div><div class="stat-label">Очки Лиги</div></div>
        <div class="stat-box"><div id="team-rating" class="stat-val">0</div><div class="stat-label">Рейтинг</div></div>
    </div>

    <div class="container">
        <div id="tab-home" class="tab-content active">
            <div class="pitch" id="pitch-container">
                <div class="pitch-line-center"></div>
                <div class="pitch-circle-center"></div>
                <div class="pitch-box-top"></div>
                <div class="pitch-box-bottom"></div>
                <div id="goal-banner" class="goal-overlay">ГОЛ! 🎉</div>
                <div id="soccer-ball" class="ball">⚽</div>

                <div class="pitch-row" id="row-att"></div>
                <div class="pitch-row" id="row-mid"></div>
                <div class="pitch-row" id="row-def"></div>
                <div class="pitch-row" id="row-gk"></div>
            </div>

            <button id="play-btn" class="btn-main" onclick="playAnimatedMatch()">Играть матч</button>
            <div id="match-log" class="log-box">Нажмите кнопку, чтобы начать матч.</div>
        </div>

        <div id="tab-team" class="tab-content">
            <div style="margin-bottom: 12px; font-weight: 700; font-size: 16px;">Основной состав</div>
            <div id="squad" class="player-grid"></div>
        </div>

        <div id="tab-transfers" class="tab-content">
            <div style="margin-bottom: 12px; font-weight: 700; font-size: 16px;">Трансферный рынок</div>
            <div id="market" class="player-grid"></div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)"><span class="nav-icon">⚔️</span>Поле</div>
        <div class="nav-item" onclick="switchTab('team', this)"><span class="nav-icon">⚽</span>Команда</div>
        <div class="nav-item" onclick="switchTab('transfers', this)"><span class="nav-icon">🛒</span>Рынок</div>
    </div>

    <script>
        let state = JSON.parse(localStorage.getItem('fc_manager_pro_data')) || {
            coins: 1000,
            points: 0,
            team: [
                { id: "1", name: "А. Смирнов", pos: "Нападающий", statName: "Удар", value: 88, avatar: "👦🏽" },
                { id: "2", name: "И. Иванов", pos: "Полузащитник", statName: "Пас", value: 82, avatar: "🧑🏼‍🦱" },
                { id: "3", name: "Д. Петров", pos: "Защитник", statName: "Защита", value: 86, avatar: "👨🏽" },
                { id: "4", name: "М. Соколов", pos: "Вратарь", statName: "Рефлексы", value: 89, avatar: "👦🦰" }
            ],
            market: []
        };

        const firstNames = ["А.", "И.", "Д.", "М.", "С.", "К.", "Е."];
        const lastNames = ["Смирнов", "Иванов", "Петров", "Соколов", "Морозов", "Волков", "Васильев"];
        const avatars = ["👦🏽", "🧑🏼‍🦱", "👨🏽", "👦🦰", "🧔‍♂️", "👱‍♂️"];

        function getRarity(val) {
            if (val >= 90) return "legendary";
            if (val >= 80) return "epic";
            if (val >= 70) return "rare";
            return "common";
        }

        function generatePlayer() {
            const positions = [
                { pos: "Нападающий", stat: "Удар" },
                { pos: "Полузащитник", stat: "Пас" },
                { pos: "Защитник", stat: "Защита" },
                { pos: "Вратарь", stat: "Рефлексы" }
            ];
            const pRole = positions[Math.floor(Math.random() * positions.length)];
            const val = Math.floor(Math.random() * (94 - 65 + 1)) + 65;

            return {
                id: Math.random().toString(36).substr(2, 9),
                name: firstNames[Math.floor(Math.random() * firstNames.length)] + " " + lastNames[Math.floor(Math.random() * lastNames.length)],
                pos: pRole.pos,
                statName: pRole.stat,
                value: val,
                price: val * 12,
                avatar: avatars[Math.floor(Math.random() * avatars.length)]
            };
        }

        // Заполнение рынка, если пуст
        if (!state.market || state.market.length === 0) {
            state.market = [];
            for (let i = 0; i < 4; i++) state.market.push(generatePlayer());
        }

        function save() {
            localStorage.setItem('fc_manager_pro_data', JSON.stringify(state));
            render();
        }

        function buyPlayer(index) {
            const p = state.market[index];
            if (state.coins >= p.price) {
                state.coins -= p.price;
                state.team.push(p);
                state.market.splice(index, 1);
                state.market.push(generatePlayer());
                save();
            } else {
                alert("Недостаточно монет!");
            }
        }

        // РЕНДЕР ИНТЕРФЕЙСА
        function render() {
            document.getElementById('coins').innerText = state.coins;
            document.getElementById('league-pts').innerText = state.points;

            let avgRating = 0;
            if (state.team.length > 0) {
                const total = state.team.reduce((sum, p) => sum + p.value, 0);
                avgRating = Math.round(total / state.team.length);
            }
            document.getElementById('team-rating').innerText = avgRating;

            // 1. Отрисовка расстановки на Поле
            const rowAtt = document.getElementById('row-att');
            const rowMid = document.getElementById('row-mid');
            const rowDef = document.getElementById('row-def');
            const rowGk = document.getElementById('row-gk');

            rowAtt.innerHTML = ""; rowMid.innerHTML = ""; rowDef.innerHTML = ""; rowGk.innerHTML = "";

            state.team.forEach(p => {
                const playerHTML = `
                    <div class="field-player" id="fp-${p.id}">
                        <div class="field-avatar">${p.avatar}</div>
                        <div class="field-name">${p.name}</div>
                        <div class="field-role">${p.pos}</div>
                    </div>`;

                if (p.pos === "Нападающий") rowAtt.innerHTML += playerHTML;
                else if (p.pos === "Полузащитник") rowMid.innerHTML += playerHTML;
                else if (p.pos === "Защитник") rowDef.innerHTML += playerHTML;
                else rowGk.innerHTML += playerHTML;
            });

            // 2. Отрисовка Команды (Карточки)
            const squad = document.getElementById('squad');
            squad.innerHTML = "";
            state.team.forEach(p => {
                const rarity = getRarity(p.value);
                squad.innerHTML += `
                    <div class="card rarity-${rarity}">
                        <div class="card-header">
                            <div class="avatar-ring">${p.avatar}</div>
                            <div class="rating-badge">${p.value}</div>
                        </div>
                        <div class="pos-tag">${p.pos}</div>
                        <div class="player-name">${p.name}</div>
                        <div class="stat-info">
                            <span>${p.statName}</span>
                            <span>${p.value}/100</span>
                        </div>
                        <div class="progress-bg">
                            <div class="progress-fill" style="width: ${p.value}%"></div>
                        </div>
                    </div>`;
            });

            // 3. Отрисовка Рынка (Карточки)
            const market = document.getElementById('market');
            market.innerHTML = "";
            state.market.forEach((p, i) => {
                const rarity = getRarity(p.value);
                market.innerHTML += `
                    <div class="card rarity-${rarity}">
                        <div class="card-header">
                            <div class="avatar-ring">${p.avatar}</div>
                            <div class="rating-badge">${p.value}</div>
                        </div>
                        <div class="pos-tag">${p.pos}</div>
                        <div class="player-name">${p.name}</div>
                        <div class="stat-info">
                            <span>${p.statName}</span>
                            <span>${p.value}/100</span>
                        </div>
                        <div class="progress-bg">
                            <div class="progress-fill" style="width: ${p.value}%"></div>
                        </div>
                        <button class="btn-small" onclick="buyPlayer(${i})">Купить (${p.price} 💰)</button>
                    </div>`;
            });
        }

        // АНИМИРОВАННЫЙ МАТЧ
        async function playAnimatedMatch() {
            const btn = document.getElementById('play-btn');
            const log = document.getElementById('match-log');
            const ball = document.getElementById('soccer-ball');
            const pitch = document.getElementById('pitch-container');
            const goalBanner = document.getElementById('goal-banner');

            btn.disabled = true;
            log.innerText = "Матч начался! Команды выходят на поле...";

            // Находим игроков
            const mid = state.team.find(p => p.pos === "Полузащитник") || state.team[0];
            const att = state.team.find(p => p.pos === "Нападающий") || state.team[0];

            const elMid = document.getElementById(`fp-${mid.id}`);
            const elAtt = document.getElementById(`fp-${att.id}`);

            const pitchRect = pitch.getBoundingClientRect();

            // Функция перемещения мяча к элементу
            function moveBallTo(element) {
                if (!element) return;
                const rect = element.getBoundingClientRect();
                const x = rect.left - pitchRect.left + rect.width / 2 - 10;
                const y = rect.top - pitchRect.top + rect.height / 2 - 10;
                ball.style.opacity = "1";
                ball.style.left = `${x}px`;
                ball.style.top = `${y}px`;
            }

            // ШАГ 1: Пас полузащитнику
            await new Promise(r => setTimeout(r, 600));
            log.innerText = `${mid.name} получает мяч в центре поля...`;
            if (elMid) {
                elMid.classList.add('has-ball');
                moveBallTo(elMid);
            }

            // ШАГ 2: Передача нападающему
            await new Promise(r => setTimeout(r, 1200));
            log.innerText = `${mid.name} отдаёт отличный пас на ${att.name}!`;
            if (elMid) elMid.classList.remove('has-ball');
            if (elAtt) {
                elAtt.classList.add('has-ball');
                moveBallTo(elAtt);
            }

            // ШАГ 3: Удар по воротам
            await new Promise(r => setTimeout(r, 1200));
            log.innerText = `${att.name} выходит один на один и бьёт по воротам!`;
            
            // Перемещаем мяч в верхнюю часть поля (в ворота)
            ball.style.left = `${pitchRect.width / 2 - 10}px`;
            ball.style.top = `15px`;

            await new Promise(r => setTimeout(r, 700));

            // Итог
            const isGoal = Math.random() > 0.35; // 65% шанс гола
            if (isGoal) {
                goalBanner.classList.add('show');
                state.points += 3;
                state.coins += 150;
                log.innerText = "🎉 ГОЛ! Победа! Получено +3 очка и 150 монет.";
            } else {
                log.innerText = "❌ Вратарь соперника совершил сэйв. Ничья (+1 очко).";
                state.points += 1;
                state.coins += 50;
            }

            await new Promise(r => setTimeout(r, 1500));
            goalBanner.classList.remove('show');
            if (elAtt) elAtt.classList.remove('has-ball');
            ball.style.opacity = "0";

            btn.disabled = false;
            save();
        }

        // Навигация по вкладкам
        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            el.classList.add('active');
        }

        render();
    </script>
</body>
</html>
