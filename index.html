<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Cyber Manager - Live Match</title>
    <style>
        :root {
            --bg: #0b0e14; --card: #161b22; --border: #30363d;
            --accent: #22c55e; --text: #ffffff; --muted: #8b949e;
            --common: #71717a; --rare: #3b82f6; --epic: #a855f7; --legendary: #eab308;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 80px; }

        .top-bar { display: flex; justify-content: space-around; padding: 15px; background: #11141c; border-bottom: 1px solid var(--border); }
        .stat-val { font-size: 16px; font-weight: 800; color: var(--accent); }
        .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; }

        /* Поле и анимация */
        .field { width: 100%; height: 300px; background: #1a472a; border-radius: 15px; border: 4px solid #fff; margin: 20px 0; position: relative; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 15px; padding: 10px; }
        .player-on-field { width: 70px; text-align: center; color: #fff; font-size: 11px; font-weight: bold; transition: transform 0.3s; }
        .avatar-circle { width: 50px; height: 50px; border-radius: 50%; background: #22c55e; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 5px; transition: 0.3s; }
        
        /* Анимация пульсации игрока */
        .active-event .avatar-circle { transform: scale(1.3); border-color: #ff0000; box-shadow: 0 0 20px #ff0000; }

        /* Карточки */
        .player-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
        .card.rarity-common { border-bottom: 4px solid var(--common); }
        .card.rarity-rare { border-bottom: 4px solid var(--rare); }
        .card.rarity-epic { border-bottom: 4px solid var(--epic); }
        .card.rarity-legendary { border-bottom: 4px solid var(--legendary); }
        
        .progress-bg { height: 6px; background: #000; border-radius: 3px; margin-top: 4px; }
        .progress-fill { height: 100%; background: var(--accent); }
        
        .btn { width: 100%; padding: 15px; background: var(--accent); border: none; border-radius: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .btn:disabled { background: #30363d; cursor: not-allowed; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: #11141c; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border); }
        .nav-item { color: var(--muted); cursor: pointer; text-align: center; }
        .nav-item.active { color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div style="text-align:center"><div id="coins" class="stat-val">1000</div><div class="stat-label">Монеты</div></div>
        <div style="text-align:center"><div id="pts" class="stat-val">0</div><div class="stat-label">Очки</div></div>
    </div>

    <div id="tab-home" class="tab-content active">
        <div class="field" id="field-view"></div>
        <div style="padding: 0 15px;">
            <button id="match-btn" class="btn" onclick="playMatch()">Играть матч</button>
            <div id="log" style="text-align:center; color: var(--muted); margin-top: 10px; height: 20px;">Готов к игре!</div>
        </div>
    </div>

    <div id="tab-team" class="tab-content">
        <div id="squad" class="player-grid"></div>
    </div>

    <div id="tab-market" class="tab-content">
        <div id="market-list" class="player-grid"></div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)">⚔️ Поле</div>
        <div class="nav-item" onclick="switchTab('team', this)">⚽ Команда</div>
        <div class="nav-item" onclick="switchTab('market', this)">🛒 Рынок</div>
    </div>

    <script>
        let state = JSON.parse(localStorage.getItem('full_game_data')) || {
            coins: 1000, points: 0,
            team: [
                { name: "Смирнов", pos: "Нападающий", statName: "Удар", val: 88, avatar: "👦🏽" },
                { name: "Иванов", pos: "Полузащитник", statName: "Пас", val: 82, avatar: "🧑🏼‍🦱" },
                { name: "Петров", pos: "Защитник", statName: "Защита", val: 86, avatar: "👨🏽" },
                { name: "Соколов", pos: "Вратарь", statName: "Рефлексы", val: 89, avatar: "👦🦰" }
            ],
            market: []
        };

        function render() {
            document.getElementById('coins').innerText = state.coins;
            document.getElementById('pts').innerText = state.points;
            
            // Рендер Поля
            const field = document.getElementById('field-view');
            field.innerHTML = "";
            state.team.forEach((p, i) => {
                field.innerHTML += `<div class="player-on-field" id="p-${i}"><div class="avatar-circle">${p.avatar}</div>${p.name}</div>`;
            });
            // ... (остальной рендер команды/рынка остается прежним)
            renderSquadAndMarket();
        }

        function renderSquadAndMarket() {
            const squad = document.getElementById('squad');
            squad.innerHTML = "";
            state.team.forEach(p => {
                const r = p.val >= 90 ? "legendary" : p.val >= 80 ? "epic" : p.val >= 70 ? "rare" : "common";
                squad.innerHTML += `
                    <div class="card rarity-${r}">
                        <div style="font-size: 10px; color: var(--muted);">${p.pos}</div>
                        <div style="font-weight: 700;">${p.name}</div>
                        <div style="font-size: 11px; margin-top:5px;">${p.statName}: ${p.val}/100</div>
                        <div class="progress-bg"><div class="progress-fill" style="width: ${p.val}%"></div></div>
                    </div>`;
            });
        }

        // Анимированный матч
        async function playMatch() {
            const btn = document.getElementById('match-btn');
            const log = document.getElementById('log');
            btn.disabled = true;

            // 1. Начало
            log.innerText = "Матч начался...";
            
            // 2. Атака
            await new Promise(r => setTimeout(r, 800));
            const attacker = Math.floor(Math.random() * state.team.length);
            document.getElementById(`p-${attacker}`).classList.add('active-event');
            log.innerText = state.team[attacker].name + " бежит в атаку!";

            // 3. Удар
            await new Promise(r => setTimeout(r, 1000));
            log.innerText = "Удар по воротам...";

            // 4. Итог
            await new Promise(r => setTimeout(r, 800));
            document.getElementById(`p-${attacker}`).classList.remove('active-event');
            
            const win = Math.random() > 0.4;
            if(win) {
                state.points += 3; state.coins += 100;
                log.innerText = "ГОЛ! Победа! 🎉";
            } else {
                log.innerText = "Вратарь поймал мяч. Ничья.";
            }

            btn.disabled = false;
            localStorage.setItem('full_game_data', JSON.stringify(state));
            render();
        }

        function switchTab(t, el) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById('tab-' + t).classList.add('active');
            el.classList.add('active');
        }
        render();
    </script>
</body>
  </html>
