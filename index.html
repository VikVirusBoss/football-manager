<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Экран настройки (первый запуск) -->
    <div id="setup-screen" class="overlay">
        <div class="modal">
            <h2>Добро пожаловать!</h2>
            <input type="text" id="club-name-input" placeholder="Название вашего клуба">
            <button class="btn" onclick="initClub()">Создать клуб</button>
        </div>
    </div>

    <!-- Анпакинг (первый запуск) -->
    <div id="pack-screen" class="overlay" style="display:none;">
        <div class="modal" id="pack-modal">
            <h2 id="pack-title">Откройте пак!</h2>
            <div id="pack-content" class="squad-grid"></div>
            <button class="btn" onclick="nextPackStep()">Далее</button>
        </div>
    </div>

    <!-- Оверлей обучения -->
    <div id="tutorial-overlay" class="overlay" style="display:none; z-index: 9999;">
        <div class="tutorial-box">
            <h2 id="tut-title">Добро пожаловать!</h2>
            <p id="tut-text">Это ваш клуб.</p>
            <button class="btn" onclick="nextTutorial()">Понятно</button>
        </div>
    </div>

    <!-- Экран матча: Плашка событий -->
    <div id="match-event-overlay" class="match-event-overlay"></div>

    <div class="header">
        <div class="stat-box">
            <span class="stat">⚡ <span id="energy">25</span>/25</span>
            <span class="stat">🪙 <span id="coins">1000</span></span>
        </div>
        <div id="club-display">Ваш Клуб</div>
    </div>

    <div class="nav">
        <button class="nav-btn active" id="nav-match" onclick="switchTab('match-tab')">🏟️ Матч</button>
        <button class="nav-btn" id="nav-squad" onclick="switchTab('squad-tab')">📋 Состав</button>
        <button class="nav-btn" id="nav-league" onclick="switchTab('league-tab')">🏆 Лига</button>
        <button class="nav-btn" id="nav-market" onclick="switchTab('market-tab')">🛒 Рынок</button>
        <button class="nav-btn" id="nav-store" onclick="switchTab('store-tab')">🎁 Магазин</button>
    </div>

    <div id="match-tab" class="tab-content active">
        <div class="match-header" id="match-header"></div>
        <div class="controls-bar">
            <select id="formation-select" onchange="changeFormation(this.value)">
                <option value="4-3-3">4-3-3</option><option value="4-4-2">4-4-2</option>
                <option value="3-5-2">3-5-2</option><option value="5-3-2">5-3-2</option>
            </select>
            <button class="btn btn-green" id="play-btn" onclick="playMatch()">Сыграть</button>
        </div>
        <div class="pitch" id="pitch"></div>
        <div class="log-box" id="match-log">Готов к матчу.</div>
    </div>

    <div id="squad-tab" class="tab-content">
        <h3>Основа (11)</h3><div class="squad-grid" id="main-squad-list"></div>
        <h3>Запасные (на матч)</h3><div class="squad-grid" id="subs-list"></div>
        <h3>Резерв</h3><div class="squad-grid" id="reserve-list"></div>
    </div>

    <div id="league-tab" class="tab-content">
        <h3>Турнирная таблица</h3>
        <table id="league-table"></table>
        <h3>Календарь (Расписание)</h3>
        <div id="schedule-list"></div>
    </div>

    <div id="market-tab" class="tab-content">
        <h3>Трансферный рынок</h3>
        <div class="squad-grid" id="market-list"></div>
    </div>

    <div id="store-tab" class="tab-content">
        <h3>Магазин Паков</h3>
        <div class="squad-grid"><button class="btn" onclick="buyPack('silver', 500)">Серебро (500🪙)</button></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
