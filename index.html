<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Football Manager</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; user-select: none; }
        body { background-color: #0d1117; color: #f8fafc; padding-bottom: 80px; }
        
        /* Шапка */
        .header { display: flex; justify-content: space-between; background: #161b22; padding: 15px; border-bottom: 1px solid #30363d; }
        .stat-box { text-align: center; }
        .stat-title { font-size: 10px; color: #8b949e; text-transform: uppercase; }
        .stat-value { font-size: 16px; font-weight: bold; color: #38bdf8; }

        .container { padding: 16px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Заголовок команды и редактирование */
        .team-title-row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0 15px; }
        .team-title { font-size: 22px; font-weight: bold; color: #f8fafc; }
        .btn-edit { background: #21262d; border: 1px solid #30363d; color: #38bdf8; padding: 6px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; }
        .btn-edit:active { transform: scale(0.95); }

        .section-title { font-size: 16px; margin: 15px 0 10px; font-weight: bold; color: #8b949e; }
        .player-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .fut-card { background: #161b22; border-radius: 12px; padding: 10px; border: 1px solid #30363d; }
        .fut-header { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
        .fut-rating { background: #eab308; color: #000; font-weight: bold; font-size: 12px; padding: 2px 5px; border-radius: 4px; }
        .flag-icon { width: 18px; height: 13px; border-radius: 2px; }
        .fut-name { font-size: 13px; font-weight: bold; margin-top: 5px; }

        /* Поле матча */
        #match-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a472a; z-index: 200; padding: 20px; }
        .field { width: 100%; height: 100%; border: 3px solid white; border-radius: 10px; position: relative; background: #2d8a2d; }
        .center-line { position: absolute; top: 50%; left: 0; right: 0; height: 2px; background: rgba(255,255,255,0.3); }
        .player-dot { position: absolute; width: 20px; height: 20px; border-radius: 50%; border: 2px solid white; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: bold; }
        .my-team { background: #38bdf8; }
        .enemy-team { background: #ef4444; }

        /* Навигация */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #161b22; border-top: 1px solid #30363d; display: flex; justify-content: space-around; padding: 12px 0; }
        .nav-item { color: #8b949e; cursor: pointer; font-size: 12px; }
        .nav-item.active { color: #22c55e; }

        .btn-primary { width: 100%; background: #22c55e; color: #000; padding: 15px; border: none; border-radius: 12px; font-weight: bold; margin-top: 20px; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 300; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #161b22; padding: 30px; border-radius: 20px; text-align: center; border: 1px solid #22c55e; }
    </style>
</head>
<body>

    <div class="header">
        <div class="stat-box"><div class="stat-title">Монеты</div><div class="stat-value" id="coins">1 000 🪙</div></div>
        <div class="stat-box"><div class="stat-title">Рейтинг</div><div class="stat-value" id="rating">1 842</div></div>
    </div>

    <div class="container">
        <!-- ГЛАВНАЯ -->
        <div id="tab-home" class="tab-content active">
            <div class="team-title-row">
                <span class="team-title" id="team-name">FC Cyber</span>
                <button class="btn-edit" onclick="editTeamName()">✏️ Изменить</button>
            </div>
            
            <button class="btn-primary" onclick="startMatch()">⚽ Играть матч</button>
        </div>

        <!-- КОМАНДА -->
        <div id="tab-team" class="tab-content">
            <div class="section-title">Основной состав (11)</div>
            <div class="player-grid">
                <div class="fut-card"><div class="fut-header"><span class="fut-rating">88</span><img class="flag-icon" src="https://flagcdn.com/24x18/es.png"></div><div class="fut-name">М. Гарсия</div></div>
                <div class="fut-card"><div class="fut-header"><span class="fut-rating">86</span><img class="flag-icon" src="https://flagcdn.com/24x18/ru.png"></div><div class="fut-name">А. Смирнов</div></div>
            </div>
            <div class="section-title">Запасные (7)</div>
            <div class="player-grid">
                 <div class="fut-card" style="opacity: 0.7;"><div class="fut-header"><span class="fut-rating">75</span><img class="flag-icon" src="https://flagcdn.com/24x18/br.png"></div><div class="fut-name">Б. Лука</div></div>
            </div>
        </div>

        <!-- ПРОФИЛЬ -->
        <div id="tab-profile" class="tab-content">
            <div class="section-title">Профиль Менеджера</div>
            <p style="margin-top: 8px;">Команда: <b id="profile-team-name">FC Cyber</b></p>
            <p style="margin-top: 4px;">Уровень: 1</p>
        </div>
    </div>

    <!-- ВИЗУАЛИЗАЦИЯ МАТЧА -->
    <div id="match-view">
        <div class="field">
            <div class="center-line"></div>
            <!-- Схема 4-4-2 (Мои - синие) -->
            <div class="player-dot my-team" style="bottom: 5%; left: 50%;">GK</div>
            <div class="player-dot my-team" style="bottom: 15%; left: 20%;">DF</div>
            <div class="player-dot my-team" style="bottom: 15%; left: 40%;">DF</div>
            <div class="player-dot my-team" style="bottom: 15%; left: 60%;">DF</div>
            <div class="player-dot my-team" style="bottom: 15%; left: 80%;">DF</div>
            <!-- Соперник (Красные) -->
            <div class="player-dot enemy-team" style="top: 5%; left: 50%;">GK</div>
            <div class="player-dot enemy-team" style="top: 15%; left: 30%;">FW</div>
            <div class="player-dot enemy-team" style="top: 15%; left: 70%;">FW</div>
        </div>
    </div>

    <!-- ОКНО РЕЗУЛЬТАТА -->
    <div id="result-modal" class="modal">
        <div class="modal-content">
            <h2 style="color: #22c55e; margin-bottom: 10px;">ПОБЕДА! 🎉</h2>
            <h1 style="font-size: 20px; margin-bottom: 15px;" id="match-score">FC Cyber 2 — 1 Red Bulls</h1>
            <button class="btn-primary" onclick="closeMatch()">Отлично</button>
        </div>
    </div>

    <!-- НАВИГАЦИЯ -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)">🏠 Главная</div>
        <div class="nav-item" onclick="switchTab('team', this)">⚽ Команда</div>
        <div class="nav-item" onclick="switchTab('profile', this)">👤 Профиль</div>
    </div>

    <script>
        let currentTeamName = localStorage.getItem('userTeamName') || "FC Cyber";
        
        function updateTeamDisplay() {
            document.getElementById('team-name').innerText = currentTeamName;
            document.getElementById('profile-team-name').innerText = currentTeamName;
        }

        updateTeamDisplay();

        function editTeamName() {
            const newName = prompt("Введите новое название команды (на английском):", currentTeamName);
            if (newName && newName.trim() !== "") {
                currentTeamName = newName.trim();
                localStorage.setItem('userTeamName', currentTeamName);
                updateTeamDisplay();
            }
        }

        function switchTab(tab, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            el.classList.add('active');
        }

        function startMatch() {
            document.getElementById('match-view').style.display = 'block';
            setTimeout(() => {
                const score1 = Math.floor(Math.random() * 3) + 2;
                const score2 = Math.floor(Math.random() * score1);
                document.getElementById('match-score').innerText = `${currentTeamName} ${score1} — ${score2} Red Bulls`;
                document.getElementById('result-modal').style.display = 'flex';
            }, 2000);
        }

        function closeMatch() {
            document.getElementById('match-view').style.display = 'none';
            document.getElementById('result-modal').style.display = 'none';
        }
    </script>
</body>
              </html>
