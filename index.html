<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>My Football League</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; user-select: none; }
        body { background-color: #0d1117; color: #f8fafc; padding-bottom: 80px; }
        .header { display: flex; justify-content: space-between; background: #161b22; padding: 15px; border-bottom: 1px solid #30363d; }
        .stat-value { font-size: 16px; font-weight: bold; color: #38bdf8; }
        .container { padding: 16px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .section-title { font-size: 16px; margin: 20px 0 10px; font-weight: bold; color: #8b949e; border-left: 3px solid #22c55e; padding-left: 8px; }
        .player-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .fut-card { background: #161b22; border-radius: 10px; padding: 10px; border: 1px solid #30363d; text-align: center; }
        .fut-card.locked { background: #0d1117; border: 1px dashed #30363d; opacity: 0.6; }
        .fut-rating { background: #eab308; color: #000; font-weight: bold; font-size: 10px; padding: 2px 4px; border-radius: 4px; display: inline-block; margin-bottom: 5px;}
        .fut-avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #eab308; display: block; margin: 0 auto; background: #222;}
        .fut-name { font-size: 12px; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #161b22; border-top: 1px solid #30363d; display: flex; justify-content: space-around; padding: 12px 0; }
        .nav-item { color: #8b949e; cursor: pointer; font-size: 12px; text-align: center;}
        .nav-item.active { color: #22c55e;}
    </style>
</head>
<body>
    <div class="header">
        <div><div style="font-size: 10px; color: #8b949e;">МОНЕТЫ</div><div class="stat-value">1 000</div></div>
        <div><div style="font-size: 10px; color: #8b949e;">РЕЙТИНГ</div><div class="stat-value" id="team-rating">0</div></div>
    </div>
    <div class="container">
        <div id="tab-home" class="tab-content active">
            <div style="padding: 20px; text-align: center;"><h2>FC Cyber</h2><p>Твой клуб. Твой путь.</p></div>
        </div>
        <div id="tab-team" class="tab-content">
            <div class="section-title">Основной состав</div>
            <div id="starters" class="player-grid"></div>
            <div class="section-title">Запасные (Резерв)</div>
            <div id="subs" class="player-grid"></div>
        </div>
        <div id="tab-profile" class="tab-content"><div class="section-title">Профиль</div><p>Игрок: Главный Тренер</p></div>
    </div>
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)">🏠<br>Главная</div>
        <div class="nav-item" onclick="switchTab('team', this)">⚽<br>Команда</div>
        <div class="nav-item" onclick="switchTab('profile', this)">👤<br>Профиль</div>
    </div>
    <script>
        const firstNames = ["Иван", "Марко", "Бруно", "Андрей", "Сергей", "Дмитрий", "Павел", "Виктор", "Алексей", "Николай"];
        const lastNames = ["Иванов", "Гарсия", "Лука", "Смирнов", "Петров", "Сидоров", "Васильев", "Морозов"];

        function getTeam() {
            let team = JSON.parse(localStorage.getItem('myTeam'));
            if (!team) {
                team = [];
                for (let i = 0; i < 12; i++) {
                    team.push({
                        name: firstNames[Math.floor(Math.random() * firstNames.length)] + " " + lastNames[Math.floor(Math.random() * lastNames.length)],
                        rating: Math.floor(Math.random() * (92 - 65 + 1)) + 65
                    });
                }
                localStorage.setItem('myTeam', JSON.stringify(team));
            }
            return team;
        }

        function render() {
            const team = getTeam();
            const startersCont = document.getElementById('starters');
            const subsCont = document.getElementById('subs');
            let totalRating = 0;
            
            // Основной состав
            for(let i = 0; i < 11; i++) {
                let p = team[i];
                totalRating += p.rating;
                startersCont.innerHTML += `<div class="fut-card"><span class="fut-rating">${p.rating}</span><img class="fut-avatar" src="https://api.dicebear.com/7.x/adventurer/svg?seed=${p.name}"><div class="fut-name">${p.name}</div></div>`;
            }
            
            // Запасные
            // 1 активный
            subsCont.innerHTML += `<div class="fut-card"><span class="fut-rating">${team[11].rating}</span><img class="fut-avatar" src="https://api.dicebear.com/7.x/adventurer/svg?seed=${team[11].name}"><div class="fut-name">${team[11].name}</div></div>`;
            // 6 заблокированных
            for(let i = 0; i < 6; i++) {
                subsCont.innerHTML += `<div class="fut-card locked"><div class="fut-rating">🔒</div><div style="font-size: 24px; margin: 10px 0;">🔒</div><div class="fut-name">Закрыто</div></div>`;
            }
            
            document.getElementById('team-rating').innerText = Math.round(totalRating / 11);
        }

        function switchTab(t, el) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById('tab-' + t).classList.add('active');
            el.classList.add('active');
        }
        render();
    </script>
</body>
</html>
